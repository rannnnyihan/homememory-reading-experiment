name: Deploy reading experiment to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/admin
          cp index.html experiment_reading_real_materials_landscape.html experiment_reading_backend.html experiment-api.js experiment-deployment-config.js _site/
          mkdir -p _site/assets/experiment-groups
          cp assets/experiment-groups/*.png _site/assets/experiment-groups/
          cp experiment-api.js _site/experiment-api.v2.js
          cp experiment-api.js _site/experiment-api.v3.js
          cp experiment-api.js _site/experiment-api.v4.js
          cp experiment-api.js _site/experiment-api.v5.js
          cp experiment_reading_backend.html _site/admin/index.html
          cp experiment-api.js experiment-deployment-config.js _site/admin/
          cp experiment-api.js _site/admin/experiment-api.v2.js
          cp experiment-api.js _site/admin/experiment-api.v3.js
          cp experiment-api.js _site/admin/experiment-api.v4.js
          cp experiment-api.js _site/admin/experiment-api.v5.js
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
